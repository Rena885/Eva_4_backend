<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title|default:"Dulce Arte OpenAPI Docs" }}</title>
    <link rel="stylesheet" href="/swagger-assets/openapi-docs.css">
  </head>
  <body>
    <header class="oa-header">
      <div class="oa-header-inner">
        <div>
          <h1 class="oa-title">
            <span id="oa-doc-title">{{ title|default:"Dulce Arte API RESTful" }}</span>
            <span id="oa-doc-version" class="oa-badge-ver">OpenAPI 3.0</span>
          </h1>
          <p id="oa-doc-desc" class="oa-desc">Documentación interactiva generada desde el esquema oficial OpenAPI.</p>
        </div>
        <div>
          <a class="oa-btn-outline" href="/api/v1/schema/?format=json" target="_blank" rel="noreferrer">Descargar OpenAPI JSON</a>
        </div>
      </div>
    </header>

    <main class="oa-container">
      <section class="oa-auth-box">
        <strong>Autorización JWT:</strong>
        <input id="oa-jwt-input" type="password" class="oa-input" placeholder="Pega aquí tu token JWT (access) para probar rutas protegidas">
        <button id="oa-jwt-btn" type="button" class="oa-btn">Aplicar Bearer Token</button>
        <span id="oa-jwt-status" class="oa-desc">Sin token</span>
      </section>

      <div id="swagger-ui" data-schema-url="/api/v1/schema/?format=json">Cargando especificación OpenAPI...</div>
    </main>

    <script src="/swagger-assets/openapi-docs.js"></script>
  </body>
</html>
